    <script>
        // 1. Register Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(reg => console.log('Service Worker registered'))
                    .catch(err => console.log('SW registration failed:', err));
            });
        }

        // 2. The Offline Sync Function
        async function syncPendingAssessments() {
            if (!navigator.onLine) return;

            let queue = [];
            try {
                queue = JSON.parse(localStorage.getItem('alpha_pending_assessments') || '[]');
            } catch (e) {
                return;
            }

            if (queue.length === 0) return;

            console.log(`Starting sync of ${queue.length} pending assessments...`);
            let remaining = [];
            let syncedCount = 0;

            for (let item of queue) {
                try {
                    let formData = new FormData();
                    for (let key in item) {
                        if (key !== 'saved_at') {
                            if (Array.isArray(item[key])) {
                                item[key].forEach(val => formData.append(key, val));
                            } else {
                                formData.append(key, item[key]);
                            }
                        }
                    }

                    let response = await fetch('/new', {
                        method: 'POST',
                        body: formData
                    });

                    if (response.redirected && response.url.includes('/login')) {
                        console.log('Session expired. Pausing sync.');
                        remaining.push(item);
                        continue;
                    }

                    if (response.ok) {
                        syncedCount++;
                    } else {
                        remaining.push(item);
                    }
                } catch (err) {
                    console.error('Sync failed for item:', err);
                    remaining.push(item);
                }
            }

            localStorage.setItem('alpha_pending_assessments', JSON.stringify(remaining));

            if (syncedCount > 0) {
                console.log(`Successfully synced ${syncedCount} assessments.`);
                if (window.location.pathname === '/dashboard' || window.location.pathname === '/history') {
                    location.reload();
                }
            }
        }

        // 3. Trigger the sync when the page loads
        document.addEventListener('DOMContentLoaded', syncPendingAssessments);

        // 4. Trigger the sync when the internet comes back online
        window.addEventListener('online', () => {
            console.log('Connection restored! Attempting sync...');
            syncPendingAssessments();
        });

        // 5. Fallback check every 10 seconds
        setInterval(() => {
            if (navigator.onLine) {
                syncPendingAssessments();
            }
        }, 10000);
    </script>

</body>
</html>
