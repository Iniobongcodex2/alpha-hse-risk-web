{% extends "base.html" %}
{% block title %}New Assessment — ALPHA HSE RISK{% endblock %}
{% block header_title %}New Assessment{% endblock %}

{% block content %}

<form method="POST" action="/new" id="assessment-form">

    <!-- ASSESSMENT DETAILS -->
    <div class="card">
        <h2 style="font-size:15px; color:#0F1E3D; margin-bottom:14px;">Assessment Details</h2>

        <label style="font-size:13px; color:#6B7280; font-weight:600;">Organization</label>
        <input type="text" value="{{ session.get('organization_name', 'Unknown') }}" readonly
               style="width:100%; padding:14px; margin:6px 0 14px; border:1px solid #E5E7EB; border-radius:8px; font-size:15px; background:#F3F4F6; color:#6B7280; cursor:not-allowed;">

        <label style="font-size:13px; color:#6B7280; font-weight:600;">Department</label>
        <input type="text" name="department" placeholder="Department"
               style="width:100%; padding:14px; margin:6px 0 14px; border:1px solid #E5E7EB; border-radius:8px; font-size:15px;">

        <label style="font-size:13px; color:#6B7280; font-weight:600;">Location / Site</label>
        <input type="text" name="location" placeholder="Location"
               style="width:100%; padding:14px; margin:6px 0 14px; border:1px solid #E5E7EB; border-radius:8px; font-size:15px;">

        <label style="font-size:13px; color:#6B7280; font-weight:600;">Project</label>
        <input type="text" name="project" placeholder="Project"
               style="width:100%; padding:14px; margin:6px 0 14px; border:1px solid #E5E7EB; border-radius:8px; font-size:15px;">
    </div>

    <!-- HAZARDS CONTAINER -->
    <div id="hazards-container">
        <!-- Hazard 1 (Default) -->
        <div class="card hazard-block">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
                <h2 style="font-size:15px; color:#0F1E3D;">Hazard <span class="hazard-number">1</span></h2>
            </div>

            <label style="font-size:13px; color:#6B7280; font-weight:600;">Category</label>
            <select name="category[]" required class="category-select" onchange="toggleCustomCategory(this)"
                    style="width:100%; padding:14px; margin:6px 0 14px; border:1px solid #E5E7EB; border-radius:8px; font-size:15px; background:#FFFFFF;">
                <option value="Occupational Health">Occupational Health</option>
                <option value="Working at Height">Working at Height</option>
                <option value="Slips, Trips and Falls">Slips, Trips and Falls</option>
                <option value="Lone Working">Lone Working</option>
                <option value="Ergonomics">Ergonomics</option>
                <option value="Hazardous Substances">Hazardous Substances</option>
                <option value="Confined Spaces">Confined Spaces</option>
                <option value="Manual Handling">Manual Handling</option>
                <option value="Work Environment">Work Environment</option>
                <option value="Work Equipment and Machinery">Work Equipment and Machinery</option>
                <option value="Electrical Safety">Electrical Safety</option>
                <option value="Fire Safety">Fire Safety</option>
                <option value="First Aid">First Aid</option>
                <option value="Excavation and Trenching">Excavation and Trenching</option>
                <option value="Lifting Operations">Lifting Operations</option>
                <option value="Noise and Vibration">Noise and Vibration</option>
                <option value="Dust and Fumes">Dust and Fumes</option>
                <option value="Driving and Transport">Driving and Transport</option>
                <option value="Environmental Spills">Environmental Spills</option>
                <option value="Public Safety">Public Safety</option>
                <option value="Violence and Harassment">Violence and Harassment</option>
                <option value="Custom">Other (Please specify)</option>
            </select>

            <div class="custom-category-div" style="display: none;">
                <label style="font-size:13px; color:#6B7280; font-weight:600;">Custom Category Name</label>
                <input type="text" name="custom_category[]" class="custom-category-input" placeholder="Enter custom hazard category"
                       style="width:100%; padding:14px; margin:6px 0 14px; border:1px solid #E5E7EB; border-radius:8px; font-size:15px;">
            </div>

            <label style="font-size:13px; color:#6B7280; font-weight:600;">Hazard Name</label>
            <input type="text" name="hazard_name[]" placeholder="Enter hazard" required
                   style="width:100%; padding:14px; margin:6px 0 14px; border:1px solid #E5E7EB; border-radius:8px; font-size:15px;">

            <div style="display:flex; gap:10px;">
                <div style="flex:1;">
                    <label style="font-size:13px; color:#6B7280; font-weight:600;">Severity (1-5)</label>
                    <input type="number" name="severity[]" min="1" max="5" placeholder="1-5" required
                           style="width:100%; padding:14px; margin:6px 0 14px; border:1px solid #E5E7EB; border-radius:8px; font-size:15px;">
                </div>
                <div style="flex:1;">
                    <label style="font-size:13px; color:#6B7280; font-weight:600;">Likelihood (1-5)</label>
                    <input type="number" name="likelihood[]" min="1" max="5" placeholder="1-5" required
                           style="width:100%; padding:14px; margin:6px 0 14px; border:1px solid #E5E7EB; border-radius:8px; font-size:15px;">
                </div>
            </div>

            <label style="font-size:13px; color:#6B7280; font-weight:600;">Existing Controls</label>
            <textarea name="existing_controls[]" placeholder="What controls exist already?"
                      style="width:100%; padding:14px; margin:6px 0 14px; border:1px solid #E5E7EB; border-radius:8px; font-size:15px; min-height:80px;"></textarea>

            <label style="font-size:13px; color:#6B7280; font-weight:600;">Additional Controls</label>
            <textarea name="additional_controls[]" placeholder="What more is required?"
                      style="width:100%; padding:14px; margin:6px 0 14px; border:1px solid #E5E7EB; border-radius:8px; font-size:15px; min-height:80px;"></textarea>

            <div style="display:flex; gap:10px;">
                <div style="flex:1;">
                    <label style="font-size:13px; color:#6B7280; font-weight:600;">Residual Severity</label>
                    <input type="number" name="residual_severity[]" min="1" max="5" placeholder="1-5" required
                           style="width:100%; padding:14px; margin:6px 0 14px; border:1px solid #E5E7EB; border-radius:8px; font-size:15px;">
                </div>
                <div style="flex:1;">
                    <label style="font-size:13px; color:#6B7280; font-weight:600;">Residual Likelihood</label>
                    <input type="number" name="residual_likelihood[]" min="1" max="5" placeholder="1-5" required
                           style="width:100%; padding:14px; margin:6px 0 14px; border:1px solid #E5E7EB; border-radius:8px; font-size:15px;">
                </div>
            </div>
        </div>
    </div>

    <!-- BUTTONS -->
    <div style="display:flex; flex-direction:column; gap:10px; margin-top:10px; margin-bottom: 20px;">
        <button type="submit" class="btn-primary btn-green" style="width:100%;">
            💾 Save Assessment
        </button>
        
        <button type="button" onclick="addHazard()" class="btn-primary" style="background:#1A4B8C; color:#FFFFFF; width:100%;">
            ➕ Add Another Hazard
        </button>
        
        <!-- CLEAR ALL BUTTON -->
        <button type="button" onclick="clearAll()" class="btn-primary" style="background:#DC2626; color:#FFFFFF; width:100%;">
            🗑️ Clear All Data
        </button>
    </div>

</form>

<script>
    // ---- Custom Category Logic ----
    function toggleCustomCategory(selectElement) {
        const parentBlock = selectElement.closest('.hazard-block');
        const customDiv = parentBlock.querySelector('.custom-category-div');
        const customInput = parentBlock.querySelector('.custom-category-input');

        if (selectElement.value === 'Custom') {
            customDiv.style.display = 'block';
            customInput.required = true;
        } else {
            customDiv.style.display = 'none';
            customInput.required = false;
            customInput.value = '';
        }
    }

    // ---- Add Hazard Logic ----
    function addHazard() {
        const container = document.getElementById('hazards-container');
        const firstBlock = container.querySelector('.hazard-block');
        
        // Clone the first block
        const newBlock = firstBlock.cloneNode(true);
        
        // Clear the input values in the new block
        newBlock.querySelectorAll('input, textarea, select').forEach(input => {
            if (input.type !== 'number') input.value = '';
            input.value = '';
        });

        // Reset the dropdown to the first option
        newBlock.querySelector('.category-select').selectedIndex = 0;
        newBlock.querySelector('.custom-category-div').style.display = 'none';

        // Update the Hazard Number title
        const numHazards = container.querySelectorAll('.hazard-block').length;
        newBlock.querySelector('.hazard-number').textContent = numHazards + 1;

        // Add a "Remove" button to the cloned block
        const headerDiv = newBlock.querySelector('div[style*="justify-content:space-between"]');
        const removeBtn = document.createElement('button');
        removeBtn.type = 'button';
        removeBtn.textContent = '❌ Remove';
        removeBtn.style = 'background:none; border:none; color:#DC2626; font-weight:bold; cursor:pointer;';
        removeBtn.onclick = function() {
            newBlock.remove();
            renumberHazards();
        };
        headerDiv.appendChild(removeBtn);

        // Add the new block to the container
        container.appendChild(newBlock);
    }

    // ---- Renumber Hazards after removing one ----
    function renumberHazards() {
        const blocks = document.querySelectorAll('.hazard-block');
        blocks.forEach((block, index) => {
            block.querySelector('.hazard-number').textContent = index + 1;
        });
    }

    // ---- Clear All Logic ----
    function clearAll() {
        if (confirm("Are you sure you want to clear the entire form? All unsaved data will be lost.")) {
            const form = document.getElementById('assessment-form');
            form.reset(); // Resets all standard inputs

            const container = document.getElementById('hazards-container');
            const blocks = container.querySelectorAll('.hazard-block');
            
            // Remove all extra hazard blocks, keeping only the first one
            for (let i = 1; i < blocks.length; i++) {
                blocks[i].remove();
            }
            
            // Reset the first block completely
            const firstBlock = container.querySelector('.hazard-block');
            if (firstBlock) {
                firstBlock.querySelectorAll('input, textarea, select').forEach(input => {
                    input.value = '';
                });
                const select = firstBlock.querySelector('.category-select');
                if (select) select.selectedIndex = 0;
                
                const customDiv = firstBlock.querySelector('.custom-category-div');
                if (customDiv) customDiv.style.display = 'none';
                
                firstBlock.querySelector('.hazard-number').textContent = '1';
            }
        }
    }
</script>

{% endblock %}
